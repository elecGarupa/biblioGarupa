<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#89f5e7",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#81eddf",
                        "surface": "#fcf8ff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#eae6f4",
                        "on-tertiary-fixed-variant": "#005049",
                        "on-primary-fixed-variant": "#3323cc",
                        "primary-container": "#4f46e5",
                        "error": "#ba1a1a",
                        "surface-variant": "#e4e1ee",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f3effc",
                        "outline-variant": "#c7c4d8",
                        "primary": "#3525cd",
                        "secondary": "#0058be",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#464555",
                        "secondary-fixed-dim": "#adc6ff",
                        "secondary-container": "#2170e4",
                        "primary-fixed": "#e2dfff",
                        "tertiary-fixed-dim": "#6bd8cb",
                        "surface-container": "#f0ecf9",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf8ff",
                        "tertiary": "#00524b",
                        "surface-dim": "#dcd8e5",
                        "surface-container-highest": "#e4e1ee",
                        "on-tertiary-fixed": "#00201d",
                        "surface-bright": "#fcf8ff",
                        "inverse-primary": "#c3c0ff",
                        "on-secondary-container": "#fefcff",
                        "surface-tint": "#4d44e3",
                        "on-surface": "#1b1b24",
                        "on-background": "#1b1b24",
                        "on-secondary-fixed-variant": "#004395",
                        "tertiary-container": "#006c63",
                        "surface-container-low": "#f5f2ff",
                        "outline": "#777587",
                        "inverse-surface": "#302f39",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed": "#001a42",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001a42",
                        "secondary-fixed": "#d8e2ff",
                        "on-primary-container": "#dad7ff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xl": "32px",
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "xxl": "48px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #fcf8ff;
        }
        .dark body {
            background-color: #1b1b24;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
        }
        .dark .login-card {
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .abstract-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(53, 37, 205, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface p-md relative overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="absolute inset-0 abstract-pattern opacity-60 pointer-events-none"></div>
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary/10 rounded-full blur-3xl pointer-events-none"></div>
<main class="w-full max-w-[440px] z-10">
<!-- Login Card -->
<div class="login-card bg-surface dark:bg-surface-container-low rounded-2xl p-xl border border-outline-variant/30 dark:border-outline/10">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-md shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary-container !text-[40px]" data-icon="menu_book">menu_book</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface dark:text-primary-fixed mb-xs tracking-tight">BiblioGarupa</h1>
<p class="font-label-md text-label-md text-outline tracking-[0.15em] uppercase">ACCESO ADMINISTRATIVO</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="username">USUARIO</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="w-full h-14 pl-[52px] pr-md bg-surface-container-lowest dark:bg-surface-dim border border-outline-variant dark:border-outline rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-outline-variant" id="username" name="username" placeholder="Ej: hugo" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">CONTRASEÑA</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full h-14 pl-[52px] pr-md bg-surface-container-lowest dark:bg-surface-dim border border-outline-variant dark:border-outline rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="********" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between text-label-sm font-label-sm px-xs pt-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-5 h-5 rounded border border-outline-variant dark:border-outline checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 left-0.5 pointer-events-none" data-icon="check">check</span>
</div>
<span class="text-on-surface-variant group-hover:text-primary transition-colors">Recordarme</span>
</label>
<a class="text-primary dark:text-primary-fixed-dim hover:underline underline-offset-4" href="#">¿Olvidó su clave?</a>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-xl hover:shadow-lg hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-md" type="submit">
                    Entrar al Sistema
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Message -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant italic leading-relaxed">
                    "La biblioteca es el corazón de la comunidad."
                </p>
</div>
</div>
<!-- System Status Bar -->
<div class="mt-lg flex justify-between items-center px-md text-label-sm font-label-sm text-outline">
<div class="flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
                Servidor Activo
            </div>
<div class="flex items-center gap-md">
<button class="hover:text-primary transition-colors flex items-center gap-xs" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined !text-[18px]" data-icon="contrast">contrast</span>
                    Tema
                </button>
<span>v2.4.0</span>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for the login button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Validando...';
            this.classList.add('opacity-80');
            this.disabled = true;
            
            setTimeout(() => {
                this.innerHTML = originalContent;
                this.classList.remove('opacity-80');
                this.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
